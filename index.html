<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="weather-container">
        <div class="search-box">
            <i class="fa-solid fa-location-dot"></i>
            <input type="text" id="city-input" placeholder="Enter city name..." value="Paris">
            <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="weather-main">
            <div class="weather-icon" id="weather-icon-container">
                <i class="fa-solid fa-cloud-sun-rain"></i>
            </div>
            <h1 class="temperature" id="temp">--°C</h1>
            <p class="description" id="desc">Loading...</p>
            <p class="location" id="location-name">City, Country</p>
        </div>

        <div class="weather-details">
            <div class="detail-box">
                <i class="fa-solid fa-droplet"></i>
                <div>
                    <span class="detail-value" id="humidity">--%</span>
                    <p class="detail-label">Humidity</p>
                </div>
            </div>
            <div class="detail-box">
                <i class="fa-solidxl fa-wind"></i>
                <div>
                    <span class="detail-value" id="wind">-- km/h</span>
                    <p class="detail-label">Wind Speed</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
